name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 180s -v

      - name: Race detector
        run: go test -race ./internal/scheduler ./internal/proxy -timeout 120s

      - name: Build
        run: CGO_ENABLED=0 go build -o exa-gate-ci ./cmd/exa-gate
