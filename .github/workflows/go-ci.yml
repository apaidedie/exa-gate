name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 180s -v -shuffle=on

      - name: Race detector
        run: go test -race ./internal/scheduler ./internal/proxy ./internal/adminapi ./internal/state ./internal/upstream -timeout 240s

      - name: Build
        run: CGO_ENABLED=0 go build -o exa-gate-ci ./cmd/exa-gate
