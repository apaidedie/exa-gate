name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Docker tag to publish alongside latest
        required: true
        default: 1.1.2
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apaidedie/exa-gate

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 180s

      - name: Resolve Docker tags
        id: docker_tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.docker_tags.outputs.image }}:${{ steps.docker_tags.outputs.version }}
            ${{ steps.docker_tags.outputs.image }}:latest

      - name: Smoke test published image
        run: |
          docker pull "${{ steps.docker_tags.outputs.image }}:${{ steps.docker_tags.outputs.version }}"
          docker run -d --name smoke -p 8787:8787             -e EXA_PROXY_TOKENS=smoke_client_token_16             -e EXA_ADMIN_TOKENS=smoke_admin_token_16             -e EXA_KEYS_ENCRYPTION_SECRET=smoke_encryption_secret_16             "${{ steps.docker_tags.outputs.image }}:${{ steps.docker_tags.outputs.version }}"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/_proxy/live > /dev/null 2>&1; then break; fi
            sleep 2
          done
          # Boot + native SQLite runtime + entrypoint healthcheck
          curl -fsS http://127.0.0.1:8787/_proxy/live || { docker logs smoke; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/_proxy/ready)
          [ "$code" = "503" ] || { echo "unexpected ready status without keys: $code"; docker logs smoke; exit 1; }
          # Admin session + encrypted key insert prove better-sqlite3 + AES work in-container
          SESSION=$(curl -fsS -X POST http://127.0.0.1:8787/_proxy/session             -H "Authorization: Bearer smoke_admin_token_16"             -H "Content-Type: application/json" -d '{}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["sessionId"])')
          curl -fsS -X POST http://127.0.0.1:8787/_proxy/keys             -H "Authorization: Bearer smoke_admin_token_16"             -H "x-admin-session-id: $SESSION"             -H "Content-Type: application/json"             -d '{"id":"smoke","value":"smoke-exa-key-value","weight":1}' > /dev/null
          curl -fsS http://127.0.0.1:8787/_proxy/ready || { echo "=== READY FAILED ==="; docker logs smoke 2>&1; exit 1; }
          docker rm -f smoke > /dev/null
