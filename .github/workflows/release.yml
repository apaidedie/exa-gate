name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 180s

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "exa-gate-linux-amd64" ./cmd/exa-gate
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "exa-gate-linux-arm64" ./cmd/exa-gate
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "exa-gate-windows-amd64.exe" ./cmd/exa-gate

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            exa-gate-linux-amd64
            exa-gate-linux-arm64
            exa-gate-windows-amd64.exe
